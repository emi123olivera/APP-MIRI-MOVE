<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fdf6f4">
<meta name="description" content="App personal de entrenamiento: calendario de pierna, glúteo, box y descanso; rutinas, comidas y progreso. Los datos se guardan solo en este navegador.">
<title>Miranda Move 🌷</title>
<style>
/* Layout: phone-first single column (max 560px, centered on bigger screens) · sticky top bar · fixed bottom tabs · slide-up sheets for every detail. */
:root{
  color-scheme: light;
  --bg:#fdf6f4; --cream:#fff8f4; --card:#ffffff; --soft:#fbeff2; --soft-2:#f5e5ec; --line:rgba(110,60,90,.12); --line-2:rgba(110,60,90,.22);
  --ink:#2c1e29; --mut:#68566a; --dim:#806c7d;
  --rose:#f4a9c6; --rose-l:#fde3ee; --rose-d:#b23a72;
  --lav:#bcadf3; --lav-l:#ece7fd; --lav-d:#5440a8;
  --peach:#ffc1a1; --peach-l:#ffeadf; --peach-d:#9b4a1f;
  --sage:#a9d9bb; --sage-l:#e3f4e9; --sage-d:#2b7049;
  --accent:#d9558f; --accent-2:#f07aaa;
  --shadow:0 12px 30px -22px rgba(120,50,90,.4); --shadow-s:0 6px 14px -10px rgba(120,50,90,.35);
  --f-head:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.5,.64,1);
  --tabh:68px; --col:560px;
  --body:#7a4b6a; --mach:#d9bccb; --machf:#f3e2ea; --pad:#e7c8d7;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
a{color:var(--rose-d)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:12px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.f{width:20px;height:20px;flex:none;fill:currentColor}
h1,h2,h3,h4{margin:0;font-family:var(--f-head);text-wrap:balance}
.t-leg{--c:var(--lav);--cl:var(--lav-l);--cd:var(--lav-d)}
.t-glute{--c:var(--rose);--cl:var(--rose-l);--cd:var(--rose-d)}
.t-box{--c:var(--peach);--cl:var(--peach-l);--cd:var(--peach-d)}
.t-rest{--c:var(--sage);--cl:var(--sage-l);--cd:var(--sage-d)}

/* ---------- Shell ---------- */
.app{max-width:var(--col);margin:0 auto;min-height:100vh;min-height:100dvh}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));padding-top:calc(10px + env(safe-area-inset-top,0px));background:rgba(253,246,244,.9);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid transparent;transition:border-color .3s}
.top.scrolled{border-bottom-color:var(--line)}
.brand{display:flex;align-items:center;gap:8px;min-width:0;margin-right:auto;font:800 18px/1.2 var(--f-head)}
.brand span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tulip{width:28px;height:28px;flex:none}
.avatar{flex:none;width:44px;height:44px;border-radius:50%;border:2px solid #fff;background:linear-gradient(135deg,var(--rose),var(--lav));color:#fff;font:800 17px var(--f-head);display:grid;place-items:center;box-shadow:var(--shadow-s);transition:transform .25s var(--spring)}
.avatar:active{transform:scale(.92)}
.main{padding:4px max(16px,env(safe-area-inset-right,0px)) calc(var(--tabh) + 28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow-x:clip}
.view{display:none}
.view.on{display:block;animation:viewIn .4s var(--ease)}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.view.enter .rv{animation:rise .45s var(--ease) both;animation-delay:calc(var(--i,0) * 50ms)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.vtitle{margin:8px 2px 14px;font-size:27px;font-weight:800;letter-spacing:-.01em}
.stack{display:grid;gap:14px}
.stack > *{min-width:0}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabin{max-width:var(--col);margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:54px;padding:4px 2px;border:0;border-radius:16px;background:none;color:var(--dim);font-size:11.5px;font-weight:700;transition:color .25s,background .25s,transform .2s var(--spring)}
.tab svg{width:24px;height:24px}
.tab:active{transform:scale(.92)}
.tab[aria-current="page"]{color:var(--rose-d);background:var(--rose-l)}
.tab[aria-current="page"] svg{animation:pop .45s var(--spring)}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@media (min-width:700px){body{background:linear-gradient(180deg,#fbeef3,#f8f1f7)}.app{background:var(--bg);box-shadow:0 0 0 1px var(--line)}}

/* ---------- Components ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:16px}
.ct{font-size:18px;font-weight:800}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.lnk{font-size:14px;font-weight:700;color:var(--rose-d);background:none;border:0;padding:8px 4px;border-radius:8px;min-height:40px}
.muted{color:var(--mut)}
.small{font-size:13.5px;color:var(--mut);line-height:1.45}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:999px;border:1px solid transparent;background:var(--soft);color:var(--ink);font-weight:700;font-size:15.5px;line-height:1.15;text-align:center;transition:transform .2s var(--spring),background .2s,box-shadow .2s,opacity .2s}
.btn:hover:not(:disabled){background:var(--soft-2)}
.btn:active:not(:disabled){transform:scale(.96)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:linear-gradient(135deg,var(--accent-2),var(--accent));color:#fff;box-shadow:0 10px 22px -12px rgba(217,85,143,.8)}
.btn.line{background:#fff;border-color:var(--line-2)}
.btn.line:hover:not(:disabled){background:var(--soft)}
.btn.danger{background:#fff0ee;color:#9e2f22;border-color:#f3c3bb}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px}
.btn.block{width:100%}
.btn.text{background:none;border:0;color:var(--mut);min-height:44px;font-size:14.5px;text-decoration:underline;text-underline-offset:3px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.iconbtn{display:inline-grid;place-items:center;width:44px;height:44px;flex:none;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--mut);transition:transform .2s var(--spring),color .2s,background .2s}
.iconbtn:hover:not(:disabled){color:var(--rose-d);background:var(--soft)}
.iconbtn:active:not(:disabled){transform:scale(.9)}
.iconbtn:disabled{opacity:.35}
.iconbtn.sm{width:38px;height:38px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 4px}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible;margin:0;padding:0}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 15px;border-radius:999px;border:1.5px solid var(--line);background:#fff;color:var(--mut);font-weight:700;font-size:14px;white-space:nowrap;transition:background .2s,color .2s,border-color .2s,transform .2s var(--spring)}
.chip:active{transform:scale(.95)}
.chip[aria-pressed="true"]{background:var(--rose-l);border-color:var(--rose);color:var(--ink)}
.seg{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--soft)}
.seg button{flex:1;min-height:42px;padding:0 10px;border:0;border-radius:999px;background:none;color:var(--mut);font-weight:700;font-size:15px;white-space:nowrap;transition:background .25s,color .25s,box-shadow .25s}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:var(--shadow-s)}
.seg button:disabled{opacity:.4}
.field{display:grid;gap:6px}
.field > span{font-weight:700;font-size:14.5px}
.field small{color:var(--mut);font-size:12.5px}
.input,.textarea,.select{width:100%;min-height:48px;padding:10px 14px;border-radius:14px;border:1.5px solid var(--line-2);background:#fff;color:var(--ink);font-size:16px;transition:border-color .2s,box-shadow .2s}
.textarea{min-height:96px;resize:vertical;line-height:1.45}
.input:focus,.textarea:focus,.select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(217,85,143,.18)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:48px;cursor:pointer;font-weight:600}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .tr{position:relative;flex:none;width:50px;height:30px;border-radius:999px;background:#e8d9e1;transition:background .25s}
.switch .tr::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(80,30,60,.25);transition:transform .3s var(--spring)}
.switch input:checked + .tr{background:var(--accent)}
.switch input:checked + .tr::after{transform:translateX(20px)}
.switch input:focus-visible + .tr{outline:3px solid var(--accent);outline-offset:2px}
.stepper{display:inline-flex;align-items:center;gap:2px;padding:3px;border-radius:999px;background:var(--soft)}
.stepper button{width:40px;height:40px;border:0;border-radius:50%;background:#fff;font-size:20px;font-weight:800;color:var(--rose-d);box-shadow:var(--shadow-s);transition:transform .15s var(--spring)}
.stepper button:active{transform:scale(.88)}
.stepper button:disabled{opacity:.4}
.stepper output{min-width:38px;text-align:center;font:800 18px var(--f-head)}
.empty{display:grid;justify-items:center;gap:6px;text-align:center;padding:14px 8px;color:var(--mut)}
.empty svg{width:48px;height:48px;color:var(--rose)}
.empty b{color:var(--ink);font-family:var(--f-head);font-size:16px}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:16px;background:var(--lav-l);color:#3f3170;font-size:13.5px;line-height:1.45}
.note svg{color:var(--lav-d);margin-top:1px}
.banner{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:18px;background:#fff3e6;border:1px solid #f6d3ad;color:#6d3d12;font-size:14px;font-weight:600}
.banner .btn{margin-left:auto;flex:none}
.banner.warn{background:#fff0ee;border-color:#f3c3bb;color:#7e2a1f}
.bump{animation:bump .5s var(--spring)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.2)}100%{transform:scale(1)}}
details.more{padding:0;overflow:hidden}
details.more > summary,details.opt > summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;min-height:54px;padding:0 16px;font-weight:700}
details.more > summary::-webkit-details-marker,details.opt > summary::-webkit-details-marker{display:none}
details.more > summary::after,details.opt > summary::after{content:"";margin-left:auto;width:9px;height:9px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(45deg);transition:transform .3s;flex:none}
details.more[open] > summary::after,details.opt[open] > summary::after{transform:rotate(225deg)}
details.more > summary svg{color:var(--rose-d)}
details.more .in{display:grid;gap:12px;padding:0 16px 16px;animation:rise .3s var(--ease)}
details.opt{border:1px solid var(--line);border-radius:16px;background:#fff}
details.opt > summary{min-height:50px;padding:0 14px}
details.opt .in{display:grid;gap:12px;padding:0 14px 14px}
.list{display:grid;gap:8px}
.rowlink{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;min-height:64px;padding:10px 14px 10px 10px;border-radius:20px;border:1px solid var(--line);background:#fff;box-shadow:var(--shadow-s);text-align:left;color:var(--ink);transition:transform .2s var(--spring),border-color .2s}
.rowlink:active{transform:scale(.98)}
.rowlink:hover{border-color:var(--c,var(--rose))}
.rowlink .ri{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--cl,var(--soft));color:var(--cd,var(--rose-d))}
.rowlink .rt b{display:block;font-size:15.5px;line-height:1.25}
.rowlink .rt span{font-size:13.5px;color:var(--mut);line-height:1.3;margin-top:2px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.rowlink > svg:last-child{color:var(--dim)}

/* ---------- Home ---------- */
.hello{position:relative;overflow:hidden;padding:20px 18px;border-radius:26px;background:linear-gradient(135deg,#fde0ec 0%,#efe8fd 60%,#ffe9dc 100%);border:1px solid rgba(255,255,255,.7);box-shadow:var(--shadow)}
.hello h1{font-size:27px;font-weight:800;letter-spacing:-.01em;position:relative}
.hello .date{margin:4px 0 0;font-weight:600;color:var(--mut);position:relative}
.hello .comp{display:inline-flex;align-items:center;gap:6px;margin:10px 0 0;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.75);font-weight:700;font-size:13.5px;position:relative}
.hello .msg{margin:10px 0 0;font-weight:600;color:#5b3a52;font-size:15px;position:relative}
.hello .petal{position:absolute;right:-6px;top:-8px;width:110px;height:110px;opacity:.45;pointer-events:none}
.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.qbtn{position:relative;display:grid;justify-items:start;align-content:start;gap:6px;min-height:104px;padding:14px;border-radius:20px;border:1.5px solid color-mix(in srgb,var(--c) 70%,#fff);background:linear-gradient(160deg,#fff,var(--cl));text-align:left;color:var(--ink);transition:transform .25s var(--spring),box-shadow .25s}
.qbtn:active{transform:scale(.96)}
.qbtn .qi{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--c);color:var(--ink)}
.qbtn .qi svg{width:23px;height:23px}
.qbtn .ql{font-weight:800;font-size:15px;line-height:1.2}
.qbtn .qs{font-size:12.5px;font-weight:600;color:var(--mut)}
.qbtn.done{border-color:var(--cd)}
.qbtn.done .qi{background:var(--cd);color:#fff;animation:pop .5s var(--spring)}
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.sday{display:grid;justify-items:center;gap:3px;padding:8px 0 6px;border-radius:14px;border:1px solid var(--line);background:#fff;font-size:11.5px;font-weight:700;color:var(--mut);min-height:66px;transition:transform .2s var(--spring)}
.sday:active{transform:scale(.94)}
.sday.today{border-color:var(--accent);background:#fff7fa}
.sday b{font:800 15px var(--f-head);color:var(--ink)}
.sday .mini{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;min-height:9px;max-width:30px}
.sday .mini i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.sday .mini i.plan{background:#fff;border:1.5px dashed var(--cd)}
.sumline{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.sc{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 12px 0 8px;border-radius:999px;background:var(--cl);font-size:13.5px;font-weight:700;color:var(--ink)}
.sc svg{width:16px;height:16px;color:var(--cd)}
.sc b{font:800 15px var(--f-head)}

/* ---------- Calendar ---------- */
.calhead{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.caltitle{flex:1;min-width:0;display:inline-flex;align-items:center;justify-content:center;gap:4px;min-height:44px;border:0;border-radius:14px;background:none;font:800 clamp(17px,4.8vw,20px) var(--f-head);text-transform:capitalize;white-space:nowrap;transition:background .2s}
.caltitle:hover{background:var(--soft)}
.dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;font-size:12px;font-weight:800;color:var(--dim);text-align:center;margin-bottom:4px}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.calgrid.slide-l{animation:slideL .35s var(--ease)}
.calgrid.slide-r{animation:slideR .35s var(--ease)}
@keyframes slideL{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
.day{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:58px;padding:5px 1px 4px;border:1.5px solid transparent;border-radius:13px;background:#fffafb;transition:border-color .2s,transform .25s var(--spring)}
.day:active{transform:scale(.93)}
.day .dn{font:700 14.5px/1.3 var(--f-head);width:28px;height:24px;display:grid;place-items:center;border-radius:999px}
.day.out{background:transparent;opacity:.45}
.day.today .dn{background:var(--ink);color:#fff}
.day.sel{border-color:var(--accent);background:#fff2f7;animation:selpop .35s var(--spring)}
@keyframes selpop{0%{transform:scale(.9)}100%{transform:scale(1)}}
.badges{display:flex;flex-wrap:wrap;justify-content:center;gap:2px}
.bdg{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:5px;font:800 10px/1 var(--f-body);background:var(--c);color:var(--ink)}
.bdg.plan{background:#fff;border:1.5px dashed var(--cd);color:var(--cd)}
.bdg.new{animation:pop .5s var(--spring)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:12px;font-size:12.5px;font-weight:700;color:var(--mut)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.when{display:inline-flex;align-items:center;gap:6px;margin:0;font-weight:700;font-size:13.5px;padding:6px 12px;border-radius:999px;background:var(--soft);color:var(--mut);justify-self:start}
.when.future{background:var(--lav-l);color:var(--lav-d)}
.when.today{background:var(--rose-l);color:var(--rose-d)}
.drows{display:grid;gap:10px}
.drow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;min-height:68px;padding:10px 14px 10px 10px;border-radius:20px;border:1.5px solid color-mix(in srgb,var(--c) 65%,#fff);background:#fff;text-align:left;color:var(--ink);transition:transform .2s var(--spring),background .2s;animation:rise .35s var(--ease) both}
.drow:nth-child(2){animation-delay:40ms}.drow:nth-child(3){animation-delay:80ms}.drow:nth-child(4){animation-delay:120ms}
.drow:active{transform:scale(.97)}
.drow .di{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--cl);color:var(--cd)}
.drow .di svg{width:22px;height:22px}
.drow .dt b{display:block;font-size:15.5px;line-height:1.25}
.drow .dt span{display:block;font-size:13px;color:var(--mut);margin-top:2px;line-height:1.3;overflow-wrap:anywhere}
.drow > svg:last-child{color:var(--dim)}
.drow.done{background:var(--cl);border-color:var(--cd)}
.drow.done .di{background:var(--cd);color:#fff}
.drow.plan{border-style:dashed;border-color:var(--cd)}
.review{display:grid;gap:14px}
.rvbox{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 14px;align-items:center;padding:16px;border-radius:20px;background:var(--cl);border:1.5px solid var(--c)}
.rvbox .ri{grid-row:span 2;width:56px;height:56px;border-radius:18px;display:grid;place-items:center;background:var(--c)}
.rvbox .ri svg{width:28px;height:28px}
.rvbox b{font:800 19px var(--f-head)}
.rvbox span{font-weight:600;color:var(--mut)}
.scale{display:flex;gap:6px}
.scale button{flex:1;min-height:44px;border-radius:12px;border:1.5px solid var(--line-2);background:#fff;font-weight:800;transition:background .2s,border-color .2s}
.scale button[aria-pressed="true"]{background:var(--lav-l);border-color:var(--lav-d)}
.warnline{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:14px;background:#fff6e8;color:#6d3d12;font-size:13.5px;font-weight:600;line-height:1.4}

/* ---------- Routines ---------- */

.rirline svg{color:var(--cd);margin-top:2px}
.exlist{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.exrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px;border-radius:20px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow-s);text-align:left;width:100%;color:var(--ink);transition:transform .2s var(--spring),border-color .2s}
button.exrow:active{transform:scale(.98)}

.stagebox{position:relative;border-radius:22px;overflow:hidden;background:radial-gradient(70% 60% at 50% 40%,rgba(244,169,198,.22),transparent 70%),#fff;border:1px solid var(--line)}

.phase{position:absolute;left:10px;top:10px;display:inline-flex;align-items:center;gap:7px;min-height:30px;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.92);font-weight:700;font-size:13px;box-shadow:var(--shadow-s)}

.playb{position:absolute;right:10px;bottom:10px;width:48px;height:48px;border-radius:50%;border:0;display:grid;place-items:center;background:var(--c);color:var(--ink);box-shadow:var(--shadow-s);transition:transform .2s var(--spring)}

.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 12px;border-radius:999px;background:var(--cl,var(--soft));font-weight:700;font-size:13.5px}
.cues{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.cues li{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:14px;background:#fff;border:1px solid var(--line);font-size:15px;line-height:1.4}

/* ---------- Workout ---------- */
.wo{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:var(--bg);transform:translateY(100%);visibility:hidden;transition:transform .45s var(--ease),visibility 0s linear .45s}
.wo.open{transform:none;visibility:visible;transition:transform .45s var(--ease),visibility 0s}
.wohead{display:flex;align-items:center;gap:10px;padding:10px max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px));padding-top:calc(10px + env(safe-area-inset-top,0px));background:#fff;border-bottom:1px solid var(--line)}
.wohead .tt{flex:1;min-width:0}
.wohead .tt b{display:block;font:800 17px var(--f-head);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wohead .tt span{font-size:13px;color:var(--mut);font-weight:600}
.wobody{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:14px max(14px,env(safe-area-inset-right,0px)) 20px max(14px,env(safe-area-inset-left,0px))}
#woList{max-width:var(--col);margin:0 auto;display:grid;gap:10px}
.woprog{display:grid;gap:6px;font-size:14px;font-weight:700;color:var(--mut)}
.bar{height:10px;border-radius:999px;background:var(--soft-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--lav),var(--accent-2));transition:width .6s var(--ease)}
.paused{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;background:var(--lav-l);color:#3f3170;font-weight:700}
.paused .btn{margin-left:auto}
.woex{border-radius:20px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow-s);overflow:hidden}
.woex.open{border-color:color-mix(in srgb,var(--c) 70%,#fff)}
.eh{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;min-height:64px;padding:10px 14px 10px 10px;border:0;background:none;text-align:left;color:var(--ink)}
.eh .n{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--cl);color:var(--cd);font:800 16px var(--f-head)}
.eh .n.ok{background:var(--sage);color:#173d28}
.eh b{display:block;font-size:15.5px;line-height:1.25}
.eh .s{display:block;font-size:13px;color:var(--mut);margin-top:2px}
.eh > svg:last-child{color:var(--dim);transition:transform .3s}
.woex.open .eh > svg:last-child{transform:rotate(180deg)}
.eb{display:grid;gap:10px;padding:0 12px 14px;animation:rise .3s var(--ease)}
.prev{font-size:13.5px;color:var(--mut);padding:8px 10px;border-radius:12px;background:var(--soft)}
.prev b{color:var(--ink)}
.setgrid{display:grid;gap:6px}
.sethead,.setrow{display:grid;grid-template-columns:64px minmax(0,1fr) minmax(0,1fr) 52px;gap:8px;align-items:center}
.sethead{font-size:11.5px;font-weight:800;color:var(--dim);text-transform:uppercase;letter-spacing:.05em}

.setrow input{width:100%;min-height:48px;padding:0 8px;border-radius:12px;border:1.5px solid var(--line-2);background:#fff;font:700 17px var(--f-body);text-align:center}
.setrow input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(217,85,143,.18)}
.setrow.warmrow input{background:#fffaf6;border-style:dashed}
.setrow .done{width:52px;height:48px;border-radius:12px;border:1.5px solid var(--line-2);background:#fff;display:grid;place-items:center;color:var(--dim);transition:background .25s,color .25s,border-color .25s,transform .2s var(--spring)}
.setrow .done[aria-pressed="true"]{background:var(--sage);border-color:var(--sage-d);color:#173d28;animation:pop .4s var(--spring)}
.setrow .done:active{transform:scale(.9)}
details.wmore{border-top:1px dashed var(--line-2);padding-top:2px}
details.wmore > summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;min-height:44px;font-weight:700;font-size:14px;color:var(--mut)}
details.wmore > summary::-webkit-details-marker{display:none}
details.wmore .in{display:grid;gap:8px;padding-bottom:4px}
.btnrow{display:flex;flex-wrap:wrap;gap:6px}
.wodock{border-top:1px solid var(--line);background:#fff;padding:10px max(14px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.wodock > div{max-width:var(--col);margin:0 auto;display:grid;gap:10px}
.timer{display:flex;align-items:center;gap:10px}
.tring{position:relative;width:56px;height:56px;flex:none}
.tring svg{width:100%;height:100%;transform:rotate(-90deg)}
.tring .rb{fill:none;stroke:var(--soft-2);stroke-width:9}
.tring .rf{fill:none;stroke:var(--accent);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.tring.done .rf{stroke:var(--sage-d)}
.tring.done{animation:pop .6s var(--spring)}
.ttxt{flex:1;min-width:0}
.ttxt b{display:block;font:800 22px/1 var(--f-head);font-variant-numeric:tabular-nums}
.ttxt span{font-size:12.5px;color:var(--mut);font-weight:600}
.tbtns{display:flex;gap:6px}
.tpre{display:flex;gap:6px;align-items:center;font-size:13px;font-weight:700;color:var(--mut)}
.tpre .chip{min-height:36px;padding:0 12px}

/* ---------- Meals ---------- */
.wkpick{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px;align-items:center}
.wkdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wkd{display:grid;justify-items:center;gap:1px;padding:6px 0;border-radius:14px;border:1.5px solid transparent;background:#fff;font-size:11.5px;font-weight:700;color:var(--mut);min-height:58px;transition:background .2s,border-color .2s,transform .2s var(--spring)}
.wkd b{font:800 15px var(--f-head);color:var(--ink)}
.wkd i{width:6px;height:6px;border-radius:50%;background:transparent}
.wkd i.on{background:var(--peach-d)}
.wkd.today{border-color:var(--line-2)}
.wkd[aria-pressed="true"]{background:var(--rose-l);border-color:var(--rose)}
.wkd:active{transform:scale(.94)}
.dtitle{margin:2px 2px 0;font-size:18px;font-weight:800}
.slots{display:grid;gap:8px}
.slot{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:4px;border-radius:20px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow-s);padding-right:6px}
.slot.empty{background:var(--cream);border-style:dashed;box-shadow:none}
.slotbtn{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:12px;min-height:66px;padding:10px 6px 10px 10px;border:0;background:none;text-align:left;border-radius:20px;color:var(--ink)}
.slotbtn .sic{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;background:var(--peach-l);color:var(--peach-d)}
.slotbtn .sl{display:block;font-size:12px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.slotbtn b{display:block;font-size:15px;line-height:1.3}
.slotbtn .add{color:var(--rose-d);font-weight:700}
.mtags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.mtag{display:inline-flex;align-items:center;min-height:24px;padding:0 9px;border-radius:999px;background:var(--soft);font-size:12px;font-weight:700;color:var(--mut)}
.mtag.antes{background:var(--lav-l);color:var(--lav-d)}
.mtag.despues{background:var(--rose-l);color:var(--rose-d)}
.mtag.llevar{background:var(--peach-l);color:var(--peach-d)}
.mtag.rapida{background:var(--sage-l);color:var(--sage-d)}
.mtag.alg{background:#fff4dc;color:#7a4a00}
.mlist{display:grid;gap:8px}
.mcard{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center;padding:12px 8px 12px 14px;border-radius:20px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow-s)}
.mcard .mm{cursor:pointer;background:none;border:0;padding:0;text-align:left;min-height:44px;color:var(--ink)}
.mcard b{display:block;font-size:15px;line-height:1.3}
.mcard .tm{font-size:13px;color:var(--mut)}
.star{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--dim);transition:color .2s,transform .3s var(--spring),background .2s}
.star[aria-pressed="true"]{color:var(--accent);background:var(--rose-l);animation:pop .4s var(--spring)}
.star:active{transform:scale(.85)}
.weekmeals{display:grid;gap:8px}
.wmrow{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;align-items:start;padding:10px 12px;border-radius:16px;background:#fff;border:1px solid var(--line);text-align:left;width:100%;color:var(--ink)}
.wmrow.today{border-color:var(--accent)}
.wmrow .wd{font:800 14px var(--f-head)}
.wmrow .wd small{display:block;font:600 12px var(--f-body);color:var(--mut)}
.wmrow ul{margin:0;padding:0;list-style:none;display:grid;gap:2px;font-size:13.5px}
.wmrow ul li span{color:var(--mut);font-weight:700}
.shop{display:grid;gap:6px}
.shoprow{display:flex;align-items:center;gap:12px;min-height:50px;padding:6px 12px;border-radius:14px;background:#fff;border:1px solid var(--line);cursor:pointer}
.shoprow input{width:24px;height:24px;accent-color:var(--accent);flex:none}
.shoprow span{flex:1;font-weight:600}
.shoprow small{color:var(--mut);font-weight:700}
.shoprow.have span{text-decoration:line-through;color:var(--dim)}
.hydr ul{margin:0;padding-left:20px;display:grid;gap:6px;font-size:14px;line-height:1.45}
.tipbody{display:grid;gap:10px}
.tipbody h3{font-size:20px}
.tipbody p{margin:0;font-size:15.5px;line-height:1.5;color:var(--mut)}
.action{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--peach-l);font-weight:700;font-size:15px}
.action svg{color:var(--peach-d);margin-top:1px}

/* ---------- Progress ---------- */
.big4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{padding:14px;border-radius:18px;background:var(--cl,var(--soft));display:grid;gap:2px}
.kpi b{font:800 28px/1.1 var(--f-head)}
.kpi span{font-size:13px;font-weight:700;color:var(--mut);line-height:1.25}
.achs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 4px}
.achs::-webkit-scrollbar{display:none}
.achi{flex:none;width:118px;display:grid;justify-items:center;align-content:start;gap:6px;padding:12px 8px;border-radius:18px;background:#fff;border:1px solid var(--line);font-size:12.5px;font-weight:700;line-height:1.25;text-align:center;color:var(--mut)}
.achi .aic{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:var(--soft);color:var(--dim)}
.achi.got{background:linear-gradient(160deg,#fff,var(--rose-l));border-color:var(--rose);color:var(--ink)}
.achi.got .aic{background:var(--rose);color:#fff}
.chart{width:100%;height:auto;display:block}
.chart text{font:700 11px var(--f-body);fill:var(--mut)}
.chart .bar-leg{fill:var(--lav)}
.chart .bar-glute{fill:var(--rose)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{fill:#fff;stroke:var(--accent);stroke-width:2.5}
.chart rect.bar-leg,.chart rect.bar-glute{transform-box:fill-box;transform-origin:bottom;animation:grow .7s var(--ease) both}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.heatwrap{overflow-x:auto;padding-bottom:4px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,11px);gap:3px;width:max-content}
.heat i{width:11px;height:11px;border-radius:3px;background:#f3e9ee}
.heat i.o{background:transparent}
.heat i.r{background:var(--sage)}
.heat i.t1{background:var(--lav)}
.heat i.t2{background:#c98bd6}
.heat i.t3{background:var(--accent)}
.heat i.td{outline:2px solid var(--ink);outline-offset:1px}
.hmonths{display:grid;grid-auto-flow:column;gap:3px;font-size:10.5px;font-weight:700;color:var(--dim);width:max-content;margin-bottom:4px}
.hmonths span{width:11px;overflow:visible;white-space:nowrap}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px}
.hist{display:grid;gap:8px}
.hrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-radius:16px;background:#fff;border:1px solid var(--line);text-align:left;width:100%;min-height:58px;color:var(--ink)}
.hrow .ri{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--c)}
.hrow .ri svg{width:18px;height:18px}
.hrow b{display:block;font-size:14.5px}
.hrow span{font-size:12.5px;color:var(--mut)}
.extable{width:100%;border-collapse:collapse;font-size:14px}
.extable th{text-align:left;font-size:12px;color:var(--mut);font-weight:800;padding:6px 8px;border-bottom:1px solid var(--line)}
.extable td{padding:9px 8px;border-bottom:1px solid var(--line)}
.goalrow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:58px}
.goalrow b{display:flex;align-items:center;gap:10px;font-size:16px}
.goalrow .gi{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--c)}

/* ---------- Sheet, dialog, toast ---------- */
.sheet{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;visibility:hidden;transition:visibility 0s linear .4s}
.sheet.open{visibility:visible;transition:visibility 0s}
.scrim{position:absolute;inset:0;background:rgba(45,22,40,.32);opacity:0;transition:opacity .35s}
.sheet.open .scrim{opacity:1}
.panel{position:relative;width:100%;max-width:var(--col);display:flex;flex-direction:column;max-height:92vh;max-height:92dvh;background:var(--bg);border-radius:28px 28px 0 0;box-shadow:0 -20px 50px -20px rgba(80,30,60,.4);transform:translateY(104%);transition:transform .42s var(--ease)}
.sheet.open .panel{transform:none}
.grab{width:42px;height:5px;border-radius:5px;background:#e3d2db;margin:10px auto 0;flex:none}
.ph{display:flex;align-items:center;gap:10px;padding:8px 16px;flex:none}
.ph h2{flex:1;min-width:0;font-size:19px;font-weight:800}
.pb{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:4px 16px 18px;display:grid;gap:14px;align-content:start}
.pb > *{min-width:0}
.pf{flex:none;display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:#fff}
.pf:empty{display:none}
.pf .btn{flex:1 1 130px}
.dlg{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:20px;visibility:hidden;transition:visibility 0s linear .3s}
.dlg.open{visibility:visible;transition:visibility 0s}
.dlg.open .scrim{opacity:1}
.dlgbox{position:relative;z-index:1;width:min(420px,100%);padding:22px;border-radius:26px;background:#fff;box-shadow:0 30px 70px -20px rgba(80,30,60,.5);display:grid;gap:12px;opacity:0;transform:scale(.94);transition:opacity .25s,transform .3s var(--spring)}
.dlg.open .dlgbox{opacity:1;transform:none}
.dlgbox h2{font-size:20px}
.dlgbox p{margin:0;color:var(--mut);line-height:1.5}
.dlgbox .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.dlgbox .row .btn{flex:1 1 130px}
.toast{position:fixed;left:12px;right:12px;margin:0 auto;width:fit-content;max-width:min(520px,calc(100% - 24px));bottom:calc(var(--tabh) + 16px + env(safe-area-inset-bottom,0px));z-index:95;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px;border-radius:999px;background:var(--ink);color:#fff;font-weight:700;font-size:14.5px;box-shadow:0 18px 40px -16px rgba(45,22,40,.7);opacity:0;transform:translateY(16px);pointer-events:none;transition:opacity .3s,transform .4s var(--spring)}
.toast.show{opacity:1;transform:none;pointer-events:auto}
.toast .ti{width:26px;height:26px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--rose);color:var(--ink)}
.toast .ti svg{width:15px;height:15px}
.toast .tt{padding-right:6px}
.toast button{min-height:38px;padding:0 14px;border-radius:999px;border:0;background:rgba(255,255,255,.16);color:#fff;font-weight:800;font-size:14px}
.fx{position:fixed;left:50%;bottom:calc(var(--tabh) + 60px + env(safe-area-inset-bottom,0px));z-index:94;width:0;height:0;pointer-events:none}
.fx i{position:absolute;width:16px;height:16px;margin:-8px;border-radius:70% 0 70% 0;background:var(--c);opacity:0;animation:petal 1.2s var(--ease) forwards;animation-delay:calc(var(--d) * 1ms)}
@keyframes petal{0%{opacity:0;transform:translate(0,0) rotate(0) scale(.4)}15%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(1)}}
.saved{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--sage-d)}
.saved svg{width:16px;height:16px}
.saved.err{color:#9e2f22}

/* ---------- Drawings ---------- */
svg.anim .a-floor{stroke:var(--line-2);stroke-width:2;stroke-linecap:round}
svg.anim .a-mach{fill:none;stroke:var(--mach);stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
svg.anim .a-mach.thin{stroke-width:5}
svg.anim .a-machf{fill:var(--machf);stroke:var(--mach);stroke-width:2}
svg.anim .a-pad{fill:var(--pad)}
svg.anim .a-pad2{fill:var(--pad);stroke:var(--machf);stroke-width:2}
svg.anim .a-body{fill:none;stroke:var(--body);stroke-linecap:round;stroke-linejoin:round}
svg.anim .a-head{fill:var(--body)}
svg.anim .a-foot{fill:var(--body);stroke:var(--body);stroke-width:8;stroke-linejoin:round}
svg.anim .a-band{fill:none;stroke:var(--cd);stroke-width:7;stroke-linecap:round;opacity:.9}
svg.anim .a-band2{fill:none;stroke:var(--peach);stroke-width:6;stroke-linecap:round}
svg.anim .a-axis{fill:none;stroke:var(--cd);stroke-width:1.6;stroke-dasharray:4 4;opacity:.8}
svg.anim .a-joint{fill:#fff;stroke:var(--body);stroke-width:2.5}
svg.anim .a-db{fill:#9c7d90}
#anat{display:block;width:100%;height:auto;max-height:50vh}
#anat .sil{fill:url(#silG)}
#anat .sil-line{fill:none;stroke:rgba(110,60,90,.38);stroke-width:1.5;stroke-linejoin:round}
#anat .mus{fill:var(--mc);fill-opacity:.5;stroke:#fff;stroke-width:2.6;stroke-linejoin:round;cursor:pointer;transition:fill-opacity .4s var(--ease)}
#anat.has-sel .mus{fill-opacity:.15}
#anat.has-sel .mus.on{fill-opacity:1}
#anat .mglow{fill:var(--mc);opacity:0;pointer-events:none;transition:opacity .5s}
#anat .mglow.on{opacity:.75}
#anat .bone{fill:rgba(255,255,255,.8);stroke:rgba(110,60,90,.3);stroke-width:1.2;pointer-events:none}
#anat .det{fill:none;stroke:rgba(60,30,50,.22);stroke-width:1.4;stroke-linecap:round;pointer-events:none}
#anat .vt{font:800 14px var(--f-body);fill:var(--mut);text-anchor:middle;letter-spacing:.06em}
[data-m="quads"]{--mc:var(--lav)}
[data-m="hams"]{--mc:var(--peach)}
[data-m="adds"]{--mc:#9fc3f0}
[data-m="calves"]{--mc:#c9a7ef}
[data-m="glutes"]{--mc:var(--rose)}
.chip i.dotm{width:10px;height:10px;border-radius:50%;background:var(--mc)}

/* ---------- Motion off ---------- */

/* ---------- Hojas secundarias (consejos, sesiones, mapa, propuestas) ---------- */
:where(.card) h2{font-size:18px;font-weight:800}
:where(.card,.sheet) h3{font-size:16px;font-weight:800}
.card.flat{box-shadow:none}
.grid2{display:grid;gap:10px}
.note-well{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:16px;background:var(--lav-l);color:#3f3170;font-size:13.5px;line-height:1.45}
.note-well svg{color:var(--lav-d);margin-top:1px}
.divflower{display:flex;align-items:center;gap:10px;color:var(--rose);margin:4px 0}
.divflower::before,.divflower::after{content:"";flex:1;height:1px;background:var(--line)}
.tipcard{background:linear-gradient(160deg,#fff,#fff4ec);border-color:#f8dcc8}
.tipcard .wk{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--peach-d)}
.tipcard h3{font-size:17px;margin:6px 0}
.tipcard p{margin:0 0 10px;color:var(--mut);font-size:14.5px;line-height:1.5}
.tipcard .action,.tipbody .action{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:14px;background:var(--peach-l);color:#5d3416;font-weight:600;font-size:14px}
.recs{display:grid;gap:10px}
.rec{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;padding:12px;border-radius:18px;background:var(--cl);border:1.5px solid color-mix(in srgb,var(--c) 70%,#fff)}
.rec.plan{background:#fff;border-style:dashed;border-color:var(--cd)}
.rec .ri{grid-row:span 2;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--cl);color:var(--cd)}
.rec .rt{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:800}
.rec .status{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;color:var(--cd)}
.rec .status svg{width:14px;height:14px}
.rec .rn{font-size:13.5px;color:var(--mut);line-height:1.4;overflow-wrap:anywhere}
.mchips{display:flex;flex-wrap:wrap;gap:6px}
.mchips .chip i{width:10px;height:10px;border-radius:50%;background:var(--mc)}
.hello .lnkc{border:0;cursor:pointer;color:var(--rose-d);text-decoration:underline;text-underline-offset:3px;min-height:36px}
.nextex svg{width:18px;height:18px}

html.rm *,html.rm *::before,html.rm *::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important;transition-delay:0s!important}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important;transition-delay:0s!important}
}
@media (max-width:370px){
  .quick{gap:8px}
  .qbtn{min-height:96px;padding:12px}
  .sethead,.setrow{grid-template-columns:54px minmax(0,1fr) minmax(0,1fr) 46px;gap:6px}
  .day{min-height:52px}
  .bdg{width:14px;height:14px;font-size:9px;border-radius:4px}
  .tab{font-size:10.5px}
}

var MES3=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

function pad(n){return (n<10?'0':'')+n;}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parse(s){var p=String(s).split('-');return new Date(+p[0],+p[1]-1,+p[2],12,0,0);}
function today(){return ymd(new Date());}
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return ymd(d);}
function diffDays(a,b){var A=String(a).split('-'),B=String(b).split('-');return Math.round((Date.UTC(+B[0],+B[1]-1,+B[2])-Date.UTC(+A[0],+A[1]-1,+A[2]))/864e5);}
function monday(s){var d=parse(s),w=(d.getDay()+6)%7;return addDays(s,-w);}
function isYMD(s){return typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&ymd(parse(s))===s;}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function fmtLong(s){var d=parse(s);return DIA[d.getDay()]+' '+d.getDate()+' de '+MES[d.getMonth()]+' de '+d.getFullYear();}
function fmtDay(s){var d=parse(s);return DIA[d.getDay()]+' '+d.getDate()+' de '+MES[d.getMonth()];}
function fmtShort(s){var d=parse(s);return DIA[d.getDay()].slice(0,3)+' '+d.getDate()+' '+MES3[d.getMonth()];}
function fmtDM(s){var d=parse(s);return d.getDate()+' '+MES3[d.getMonth()];}

function defaults(){
  return {app:'miranda-move',schema:SCHEMA,createdAt:new Date().toISOString(),
    profile:{appName:'Miranda Move 🌷',name:'Miranda',startDate:today(),competitionName:'Competencia',competitionDate:'',allergies:[],prefs:[],proNotes:''},
    settings:{reduceMotion:false,hideAllergens:true,goals:{leg:1,glute:1,box:0}},
    activities:[],sessions:[],active:null,routines:defaultRoutines(),
    meals:{plan:{},favorites:[],custom:[],have:{}},tips:{seen:[]}};
}
function isObj(o){return o&&typeof o==='object'&&!Array.isArray(o);}
function fill(d,def){for(var k in def){if(d[k]===undefined||d[k]===null&&def[k]!==null&&k!=='active')d[k]=clone(def[k]);else if(isObj(def[k])&&isObj(d[k])&&['plan','have'].indexOf(k)<0)fill(d[k],def[k]);}return d;}
function sanitize(d){
  if(!Array.isArray(d.activities))d.activities=[];
  d.activities=d.activities.filter(function(a){return isObj(a)&&isYMD(a.date)&&TY[a.type]&&(a.status==='planned'||a.status==='completed');}).map(function(a){if(!a.id)a.id=uid();if(!Array.isArray(a.sessionIds))a.sessionIds=[];return a;});
  if(!Array.isArray(d.sessions))d.sessions=[];
  d.sessions=d.sessions.filter(function(s){return isObj(s)&&isYMD(s.date)&&Array.isArray(s.exercises);});
  ['leg','glute'].forEach(function(k){if(!isObj(d.routines[k])||!Array.isArray(d.routines[k].exercises))d.routines[k]=defaultRoutines()[k];});
  if(!isObj(d.meals.plan))d.meals.plan={};if(!Array.isArray(d.meals.favorites))d.meals.favorites=[];if(!Array.isArray(d.meals.custom))d.meals.custom=[];if(!isObj(d.meals.have))d.meals.have={};
  if(!Array.isArray(d.profile.allergies))d.profile.allergies=[];if(!Array.isArray(d.profile.prefs))d.profile.prefs=[];
  if(!isYMD(d.profile.startDate))d.profile.startDate=today();
  if(d.profile.competitionDate&&!isYMD(d.profile.competitionDate))d.profile.competitionDate='';
  if(!Array.isArray(d.tips.seen))d.tips.seen=[];
  return d;
}
function migrate(d,raw){
  if(!isObj(d))return null;
  if(isObj(d.data)&&d.app==='miranda-move-backup')d=d.data;
  var v=+d.schema||0;
  if(v>SCHEMA){NOTICE.push('Estos datos vienen de una versión más nueva de la app. Se conservan tal cual.');return sanitize(fill(d,defaults()));}
  if(v<SCHEMA&&raw){try{localStorage.setItem(KEY+'.respaldo-v'+v,raw);}catch(e){}}
  /* v0 -> v1: estructura base; no se borra nada */
  d.schema=SCHEMA;d.app='miranda-move';
  return sanitize(fill(d,defaults()));
}
function load(){
  var raw=null;
  try{raw=localStorage.getItem(KEY);}catch(e){storageOK=false;}
  if(!raw)return defaults();
  try{var d=migrate(JSON.parse(raw),raw);if(d)return d;throw new Error('formato');}
  catch(e){try{localStorage.setItem(KEY+'.danado-'+Date.now(),raw);}catch(_){}NOTICE.push('No pudimos leer tus datos guardados; guardamos una copia aparte y empezamos de nuevo.');return defaults();}
}
function doSave(){
  clearTimeout(saveT);
  try{localStorage.setItem(KEY,JSON.stringify(S));storageOK=true;lastSave=Date.now();}
  catch(e){storageOK=false;}
  $$('[data-saved]').forEach(paintSaved);
}
function save(now){clearTimeout(saveT);if(now)doSave();else saveT=setTimeout(doSave,300);}
function paintSaved(el){el.className='saved'+(storageOK?'':' err');el.innerHTML=storageOK?ic('i-check')+'Guardado en este dispositivo':ic('i-alert')+'No se pudo guardar en este navegador';}
window.addEventListener('pagehide',function(){if(S)doSave();});
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden'&&S)doSave();else if(S)refresh();});

/* ================= CONSULTAS Y ESTADÍSTICAS ================= */
function actsOn(d){return S.activities.filter(function(a){return a.date===d;}).sort(function(a,b){return ORDER.indexOf(a.type)-ORDER.indexOf(b.type);});}
function findAct(d,t){for(var i=0;i<S.activities.length;i++){var a=S.activities[i];if(a.date===d&&a.type===t)return a;}return null;}
function actById(id){for(var i=0;i<S.activities.length;i++)if(S.activities[i].id===id)return S.activities[i];return null;}
function sesById(id){for(var i=0;i<S.sessions.length;i++)if(S.sessions[i].id===id)return S.sessions[i];return null;}
function statsBetween(a,b){
  var r={leg:0,glute:0,box:0,rest:0,days:0,restDays:0,planned:0,acts:0},days={},rdays={};
  S.activities.forEach(function(x){if(x.date<a||x.date>b)return;if(x.status==='planned'){r.planned++;return;}
    r[x.type]++;if(isTrain(x.type)){days[x.date]=1;r.acts++;}else rdays[x.date]=1;});
  r.days=Object.keys(days).length;r.restDays=Object.keys(rdays).length;return r;
}
function allStats(){return statsBetween('0000-01-01','9999-12-31');}
function planWeek(d){var n=diffDays(S.profile.startDate,d);return n<0?0:Math.floor(n/7)+1;}
function completeWeeks(){var n=diffDays(S.profile.startDate,today());return n<0?0:Math.floor(n/7);}
function weeksWithActivity(){var set={},cur=planWeek(today());S.activities.forEach(function(a){if(a.status==='completed'&&isTrain(a.type)){var w=planWeek(a.date);if(w>0&&w<=cur)set[w]=1;}});return Object.keys(set).length;}
function goalTotal(){var g=S.settings.goals;return g.leg+g.glute+g.box;}
function goalMet(mon){var g=S.settings.goals,s=statsBetween(mon,addDays(mon,6));return goalTotal()>0&&s.leg>=g.leg&&s.glute>=g.glute&&s.box>=g.box;}
function streak(){if(!goalTotal())return 0;var mon=monday(today()),n=0,first=monday(S.profile.startDate);if(goalMet(mon))n++;var w=addDays(mon,-7);var guard=0;while(w>=first&&goalMet(w)&&guard<520){n++;w=addDays(w,-7);guard++;}return n;}
function nextPlanned(){var t=today();return S.activities.filter(function(a){return a.status==='planned'&&a.date>=t;}).sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:ORDER.indexOf(a.type)-ORDER.indexOf(b.type);})[0]||null;}
function setsLogged(s){var n=0;(s.exercises||[]).forEach(function(e){(e.work||[]).forEach(function(w){if(w.done||w.w!==''&&w.w!=null||w.r!==''&&w.r!=null)n++;});});return n;}
function lowerNear(d,type,exceptId){if(type!=='leg'&&type!=='glute')return [];return S.activities.filter(function(a){return a.id!==exceptId&&(a.type==='leg'||a.type==='glute')&&Math.abs(diffDays(a.date,d))<=1&&!(a.date===d&&a.type===type);});}

/* ================= UNDO ================= */
var UNDO=null,NEWID=null;
function snap(full){return full?JSON.stringify(S):JSON.stringify({a:S.activities,s:S.sessions,act:S.active});}
function commit(label,fn,opt){
  opt=opt||{};var before=snap(opt.full);fn();save(true);UNDO={snap:before,full:!!opt.full};
  refresh();toast(label,true);if(opt.celebrate&&!RM())petals(opt.color);
}
function undo(){
  if(!UNDO)return;var o=JSON.parse(UNDO.snap);
  if(UNDO.full){S=migrate(o)||defaults();applyRM();}else{S.activities=o.a;S.sessions=o.s;S.active=o.act;}
  UNDO=null;save(true);closeSheet(true);refresh();toast('Cambio deshecho',false);
}

function runCounters(root){
  $$('[data-cnt]',root).forEach(function(el){var k=el.getAttribute('data-cnt'),to=+el.getAttribute('data-to'),from=+el.textContent||0;PREV[k]=to;
    if(RM()||from===to){el.textContent=to;return;}var t0=performance.now();

    if(!ENTER){el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump');}});

function lastFor(e,beforeId){
  var list=S.sessions.slice().sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:(b.finishedAt||0)-(a.finishedAt||0);});
  for(var i=0;i<list.length;i++){if(list[i].id===beforeId)continue;var ex=(list[i].exercises||[]).find(function(x){return (e.lib&&x.lib===e.lib)||x.name===e.name;});
    if(ex&&(ex.work||[]).some(function(w){return w.w!==''||w.r!==''||w.done;}))return {s:list[i],e:ex};}

}

/* ---------- Animación de ejercicios ---------- */
var UP=1100,HOLD1=350,DOWN=1700,HOLD2=450,CYC=UP+HOLD1+DOWN+HOLD2;
var easeF=function(u){return (1-Math.cos(Math.PI*u))/2;};
function cycleAt(ms){var m=ms%CYC;if(m<UP)return [easeF(m/UP),0];if(m<UP+HOLD1)return [1,0];if(m<UP+HOLD1+DOWN)return [1-easeF((m-UP-HOLD1)/DOWN),1];return [0,1];}
var AN={raf:0,playing:false,t0:0,el:0,cur:null,ph:null};
function buildAnim(key,phases){var svg=$('#anim');if(!svg||!ANIMS[key])return;svg.innerHTML=ANIMS[key].svg;AN.cur=ANIMS[key];AN.ph=phases;AN.el=0;setT(RM()?.6:0,0);if(RM())animPause();else animPlay();}
function setT(t,ph){var svg=$('#anim');if(!svg||!AN.cur)return;AN.cur.update(t,svg);var p=$('#phase');if(p)p.textContent=AN.ph[ph];}
function frame(now){if(!AN.playing)return;if(!$('#anim')){AN.playing=false;return;}AN.el=now-AN.t0;var r=cycleAt(AN.el);setT(r[0],r[1]);AN.raf=requestAnimationFrame(frame);}
function animPlay(){AN.playing=true;AN.t0=performance.now()-AN.el;cancelAnimationFrame(AN.raf);AN.raf=requestAnimationFrame(frame);var b=$('#playb');if(b){b.innerHTML=ic('i-pause','f');b.setAttribute('aria-label','Pausar animación');}}
function animPause(){AN.playing=false;cancelAnimationFrame(AN.raf);var b=$('#playb');if(b){b.innerHTML=ic('i-play','f');b.setAttribute('aria-label','Reproducir animación');}}
function stopAnim(){AN.playing=false;cancelAnimationFrame(AN.raf);}

  var defs=mk('defs',{},svg),lg=mk('linearGradient',{id:'silG',x1:'0',y1:'0',x2:'0',y2:'1'},defs);mk('stop',{offset:'0','stop-color':'#fbf0f4'},lg);mk('stop',{offset:'1','stop-color':'#f2dfe7'},lg);
  var cp=mk('clipPath',{id:'hc'},defs);mk('path',{d:OUT},cp);var f=mk('filter',{id:'mg',x:'-60%',y:'-60%',width:'220%',height:'220%'},defs);mk('feGaussianBlur',{stdDeviation:'9'},f);

      v[2].forEach(function(s){mk('path',{d:s.d,'class':'mglow'+(s.m===m?' on':''),'data-m':s.m},glow);mk('path',{d:s.d,'class':'mus'+(s.m===m?' on':''),'data-m':s.m},clip);});

/* ---------- Temporizador de descanso ---------- */
var TM={dur:90,remain:90000,end:0,state:'idle',iv:0},TC=2*Math.PI*42;
function tFmt(ms){var s=Math.ceil(ms/1000);return pad(Math.floor(s/60))+':'+pad(s%60);}
function tLeft(){return TM.state==='running'?Math.max(0,TM.end-Date.now()):TM.remain;}
function tPaint(){
  var ms=tLeft(),r=$('#tRing');$('#tTime').textContent=tFmt(ms);r.style.strokeDasharray=TC.toFixed(1);r.style.strokeDashoffset=(TC*(1-ms/(TM.dur*1000))).toFixed(1);
  $('#tRingBox').classList.toggle('done',TM.state==='done');
  $('#tLabel').textContent={idle:'Descanso de '+TM.dur+' s listo para iniciar',running:'Descansando',paused:'Descanso en pausa',done:'Descanso terminado. ¡Siguiente serie cuando estés lista!'}[TM.state];
  var b=$('#tStartBtn');b.innerHTML=ic(TM.state==='running'?'i-pause':'i-play','f');b.setAttribute('aria-label',TM.state==='running'?'Pausar descanso':(TM.state==='paused'?'Continuar descanso':'Iniciar descanso'));
  $$('[data-a="tPreset"]').forEach(function(x){x.setAttribute('aria-pressed',String(+x.getAttribute('data-s')===TM.dur));});
}
function tTick(){if(TM.state!=='running')return;if(tLeft()<=0){clearInterval(TM.iv);TM.state='done';TM.remain=0;tPaint();toast('Descanso terminado',false);}else tPaint();}
function tStartToggle(){
  if(TM.state==='running'){TM.remain=Math.max(0,TM.end-Date.now());TM.state='paused';clearInterval(TM.iv);tPaint();return;}
  if(TM.state==='idle'||TM.state==='done')TM.remain=TM.dur*1000;
  TM.end=Date.now()+TM.remain;TM.state='running';clearInterval(TM.iv);TM.iv=setInterval(tTick,200);tPaint();
}
function tReset(){clearInterval(TM.iv);TM.state='idle';TM.remain=TM.dur*1000;tPaint();}
function tPreset(s){TM.dur=s;tReset();}
function tStop(){clearInterval(TM.iv);TM.state='idle';TM.remain=TM.dur*1000;}
function tAuto(sec){TM.dur=sec;TM.remain=sec*1000;TM.state='idle';tStartToggle();}

  if(!isObj(data)||!Array.isArray(data.activities)||!isObj(data.profile))return {ok:false,msg:'No parece un respaldo de esta app: faltan los registros o el perfil.'};
  var bad=data.activities.filter(function(a){return !(isObj(a)&&isYMD(a.date)&&TY[a.type]&&(a.status==='planned'||a.status==='completed'));}).length;
  var dup={},dups=0;data.activities.forEach(function(a){if(!isObj(a))return;var k=a.date+'|'+a.type;if(dup[k])dups++;dup[k]=1;});
  return {ok:true,data:data,bad:bad,dups:dups,acts:data.activities.length-bad,ses:Array.isArray(data.sessions)?data.sessions.length:0,when:d.exportedAt||''};

function progChart(){
  var mon=monday(today()),weeks=[];for(var i=7;i>=0;i--){var m=addDays(mon,-7*i),s=statsBetween(m,addDays(m,6));weeks.push({m:m,leg:s.leg,glute:s.glute});}

  for(var g=0;g<=max;g++){svg+='<line class="gl" x1="'+pl+'" x2="'+(W-2)+'" y1="'+y(g).toFixed(1)+'" y2="'+y(g).toFixed(1)+'"/><text x="'+(pl-6)+'" y="'+(y(g)+4).toFixed(1)+'" text-anchor="end">'+g+'</text>';}
  weeks.forEach(function(w,i){var cx=pl+cw*i+cw/2;
    if(w.leg)svg+='<rect class="bar-leg" x="'+(cx-bw-1).toFixed(1)+'" y="'+y(w.leg).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+(y(0)-y(w.leg)).toFixed(1)+'" rx="4" style="animation-delay:'+(i*50)+'ms"><title>'+w.leg+' pierna</title></rect>';
    if(w.glute)svg+='<rect class="bar-glute" x="'+(cx+1).toFixed(1)+'" y="'+y(w.glute).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+(y(0)-y(w.glute)).toFixed(1)+'" rx="4" style="animation-delay:'+(i*50+25)+'ms"><title>'+w.glute+' glúteo</title></rect>';
    svg+='<text x="'+cx.toFixed(1)+'" y="'+(H-10)+'" text-anchor="middle">'+fmtDM(w.m).split(' ')[0]+'</text>';});
  svg+='</svg>';
  var h='<section class="card rv" style="--i:1"><h2 class="ct">Pierna y glúteo por semana</h2><p class="small" style="margin:2px 0 10px">Últimas 8 semanas · el número es el lunes de cada semana</p>'+
    (any?'<div class="legend" style="margin:0 0 8px"><span><i class="bdg t-leg">P</i>Pierna</span><span><i class="bdg t-glute">G</i>Glúteo</span></div>'+svg:'<div class="empty">'+ic('i-chart')+'<b>Aún no hay sesiones para graficar</b><span>Cuando confirmes días de pierna o glúteo, aparecerán aquí.</span></div>')+'</section>';
  h+=progExCard()+heatCard();
  return h;
}
function progExCard(){
  var opts=exOptions();if(!PG.ex&&opts.length)PG.ex=opts[0].key;
  var rows=[];S.sessions.slice().sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:(a.finishedAt||0)-(b.finishedAt||0);}).forEach(function(s){s.exercises.forEach(function(e){if((e.lib||e.name)!==PG.ex)return;
    var ws=(e.work||[]).filter(function(w){return w.w!==''||w.r!=='';});if(!ws.length)return;var best=null,reps=0;ws.forEach(function(w){var kg=parseFloat(String(w.w).replace(',','.')),r=parseInt(w.r,10);if(!isNaN(r))reps+=r;if(!isNaN(kg)&&(!best||kg>best.kg||kg===best.kg&&(r||0)>(best.r||0)))best={kg:kg,r:isNaN(r)?null:r};});
    rows.push({d:s.date,best:best,reps:reps,sets:ws.length});});});
  var h='<section class="card rv" style="--i:2"><h2 class="ct" style="margin-bottom:10px">Por ejercicio</h2><label class="field"><span class="sr">Ejercicio</span><select class="select" data-a="pgExSel">'+opts.map(function(o){return '<option value="'+esc(o.key)+'"'+(o.key===PG.ex?' selected':'')+'>'+esc(o.name)+'</option>';}).join('')+'</select></label>';
  if(!rows.length)return h+'<div class="empty">'+ic('i-note')+'<b>Sin series registradas</b><span>Al terminar una sesión con peso o repeticiones anotadas, verás aquí la comparación.</span></div></section>';
  var pts=rows.filter(function(r){return r.best;});
  if(pts.length>=2){var W=360,H=170,pl=34,pr=12,pt=14,pb=26,mx=Math.max.apply(null,pts.map(function(p){return p.best.kg;})),mn=Math.min.apply(null,pts.map(function(p){return p.best.kg;}));if(mx===mn){mx+=1;mn=Math.max(0,mn-1);}
    var X=function(i){return pl+(W-pl-pr)*(i/(pts.length-1));},Y=function(v){return pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));};
    h+='<svg class="chart" style="margin-top:10px" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Peso más alto por sesión"><line class="gl" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(mx)+'" y2="'+Y(mx)+'"/><line class="gl" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(mn)+'" y2="'+Y(mn)+'"/><text x="'+(pl-6)+'" y="'+(Y(mx)+4)+'" text-anchor="end">'+mx+'</text><text x="'+(pl-6)+'" y="'+(Y(mn)+4)+'" text-anchor="end">'+mn+'</text>'+
      '<polyline class="ln" points="'+pts.map(function(p,i){return X(i).toFixed(1)+','+Y(p.best.kg).toFixed(1);}).join(' ')+'"/>'+pts.map(function(p,i){return '<circle class="pt" cx="'+X(i).toFixed(1)+'" cy="'+Y(p.best.kg).toFixed(1)+'" r="5"><title>'+fmtDay(p.d)+': '+p.best.kg+' kg</title></circle>';}).join('')+'</svg><p class="small" style="margin:4px 0 0">Peso más alto por sesión (kg)</p>';}
  h+='<div style="overflow-x:auto;margin-top:10px"><table class="extable"><thead><tr><th>Fecha</th><th>Mejor serie</th><th>Reps</th><th>Series</th></tr></thead><tbody>'+rows.slice().reverse().map(function(r){return '<tr><td>'+fmtShort(r.d)+'</td><td>'+(r.best?r.best.kg+' kg'+(r.best.r!=null?' × '+r.best.r:''):'—')+'</td><td>'+(r.reps||'—')+'</td><td>'+r.sets+'</td></tr>';}).join('')+'</tbody></table></div><p class="small" style="margin:10px 0 0">La progresión se basa en repeticiones, técnica y esfuerzo. La app no aumenta cargas por ti.</p></section>';
  return h;
}

 bkApply:function(){if(!IMP)return;ask({title:'¿Reemplazar tus datos?',text:'Todos los registros actuales de este navegador se reemplazarán por los del respaldo.',yes:'Reemplazar'}).then(function(ok){if(!ok)return;
   try{localStorage.setItem(KEY+'.antes-de-importar',JSON.stringify(S));}catch(e){}
   var before=JSON.stringify(S),nd=migrate(clone(IMP.data));if(!nd){toast('No se pudo importar',false);return;}S=nd;IMP=null;applyRM();save(true);UNDO={snap:before,full:true};closeSheet(true);nav(VIEW);toast('Respaldo importado',true);});},
 wipe:function(){ask({title:'¿Borrar todos tus datos?',text:'Se eliminarán perfil, registros, sesiones, comidas y ajustes de este navegador.',check:'Entiendo que se borrará todo de este dispositivo',yes:'Borrar todo',danger:true}).then(function(ok){if(!ok)return;var before=JSON.stringify(S);
   try{localStorage.removeItem(KEY);}catch(e){}S=defaults();S.profile.startDate=today();applyRM();save(true);UNDO={snap:before,full:true};closeSheet(true);tStop();nav('home');toast('Datos borrados',true);});}
};

/* ---------- Acciones de la interfaz simplificada ---------- */
A.tip=function(b){tipSheet(+b.getAttribute('data-w'));};
A.rvStatus=function(b){var v=b.getAttribute('data-v'),s=$('#rvSave');$$('button',b.parentNode).forEach(function(x){x.setAttribute('aria-pressed',String(x===b));});
  if(s){s.setAttribute('data-s',v);var t=$('#rvTitle');if(t)t.textContent=rvTitle(s.getAttribute('data-t'),v);}var w=$('#rvWell');if(w)w.hidden=v!=='completed';};
A.rtMore=function(){rtMore();};
A.rtEditToggle=function(){closeSheet(true);RT.edit=!RT.edit;renderRt();var l=$('#v-rt .exlist');if(RT.edit&&l){l.scrollIntoView({block:'center',behavior:RM()?'auto':'smooth'});var f=$('#v-rt [data-a="exForm"]');if(f)f.focus({preventScroll:true});}};
A.rtEdit=A.rtEditToggle;
var _rtReset=A.rtReset;A.rtReset=function(b){closeSheet(true);_rtReset(b);};
A.woToggle=function(b){var i=+b.getAttribute('data-i');WX.open=woOpenIdx()===i?-1:i;renderWO();
  var nb=$('#woList [data-a="woToggle"][data-i="'+i+'"]');if(nb&&nb.classList.contains('eh')){nb.focus({preventScroll:true});if(WX.open===i){var bx=nb.closest('.woex');setTimeout(function(){bx.scrollIntoView({block:'start',behavior:RM()?'auto':'smooth'});},20);}}};
A.woDone=function(b){var i=+b.getAttribute('data-i'),k=b.getAttribute('data-k'),j=+b.getAttribute('data-j'),e=S.active.exercises[i],s=e[k][j];s.done=!s.done;b.setAttribute('aria-pressed',String(s.done));save();
  if(s.done&&k==='work'&&!S.active.paused)tAuto(e.rest||90);WX.open=i;woPaintEx(i);};
A.fdGoDay=function(b){closeSheet(true);FD.date=b.getAttribute('data-d');FD.tab='day';renderFood();window.scrollTo(0,0);};
A.fdDay=function(b){var d=b.getAttribute('data-d');FD.date=d;renderFood();var nb=$('#v-food [data-a="fdDay"][data-d="'+d+'"]');if(nb)nb.focus({preventScroll:true});};
A.slotTap=function(b){var k=b.getAttribute('data-slot'),id=dayPlan(FD.date)[k];PICK.slot=null;if(id&&mealById(id))mealInfo(id,k);else pickSlot(k);};
A.weekMenu=function(){weekMenu();};
A.proNotes=function(){proNotes();};
A.pgPer=function(b){PG.per=b.getAttribute('data-v');renderProg();};
A.goalSheet=function(){goalSheet();};
A.goal=function(b){var k=b.getAttribute('data-k'),n=b.getAttribute('data-n'),max=k==='box'?6:3;S.settings.goals[k]=clamp(S.settings.goals[k]+(+n),0,max);save(true);
  if(SH.open&&SH.kind==='goal'){$('#shBody').innerHTML=goalBody();var nb=$('#shBody [data-a="goal"][data-k="'+k+'"][data-n="'+n+'"]');if(nb&&nb.disabled)nb=$('#shBody [data-a="goal"][data-k="'+k+'"]:not(:disabled)');if(nb)nb.focus();}
  if(VIEW==='prog')renderProg();};
document.addEventListener('click',function(e){var b=e.target.closest('[data-a]');if(!b||b.disabled)return;var fn=A[b.getAttribute('data-a')];if(!fn)return;if(b.tagName==='INPUT'&&b.type==='checkbox')return;if(b.tagName==='SELECT')return;fn(b,e);});
document.addEventListener('change',function(e){var t=e.target;
  if(t.matches('input[type=checkbox][data-a]')){var fn=A[t.getAttribute('data-a')];if(fn)fn(t,e);return;}
  if(t.matches('select[data-a="pgExSel"]')){PG.ex=t.value;renderProg();return;}
  if(t.id==='fileIn'&&t.files&&t.files[0]){var r=new FileReader();r.onload=function(){previewImport(String(r.result));};r.onerror=function(){toast('No se pudo leer el archivo',false);};r.readAsText(t.files[0]);return;}
  if(t.matches('[data-in^="p."]'))profileInput(t,true);
});
document.addEventListener('input',function(e){var t=e.target,k=t.getAttribute('data-in');if(!k)return;
  if(k==='w'||k==='r'){var s=S.active.exercises[+t.getAttribute('data-i')][t.getAttribute('data-k')][+t.getAttribute('data-j')];s[k]=t.value.replace(/[^0-9.,]/g,'').slice(0,6);if(t.value!==s[k])t.value=s[k];save();return;}
  if(k==='note'){S.active.exercises[+t.getAttribute('data-i')].note=t.value;save();return;}
  if(k==='snote'){S.active.note=t.value;save();return;}
  if(k==='proNotes'){S.profile.proNotes=t.value;save();return;}
  if(k.indexOf('p.')===0)profileInput(t,false);
});
function profileInput(t,final){
  var f=t.getAttribute('data-in').slice(2),v=t.value;
  if(f==='startDate'){if(!isYMD(v)){if(final){t.value=S.profile.startDate;}return;}}
  if(f==='competitionDate'&&v&&!isYMD(v))return;
  if((f==='name'||f==='appName')&&final&&!v.trim()){v=f==='name'?'Miranda':'Miranda Move 🌷';t.value=v;}
  S.profile[f]=v;save();paintHeader();if(final&&VIEW!=='food')render();
}
function viewSession(id){
  var s=sesById(id);if(!s)return;
  var body='<div class="stack"><div class="lastbox"><b>'+esc(s.name)+' · '+fmtLong(s.date)+'</b>'+(s.durationMs?'Duración: '+fmtDur(s.durationMs)+' · ':'')+plural(setsLogged(s),'serie anotada','series anotadas')+(s.note?'<br>'+esc(s.note):'')+'</div>'+
    s.exercises.map(function(e){return '<div class="card flat" style="padding:14px"><h3>'+esc(e.name)+'</h3>'+((e.warm||[]).length?'<p class="small" style="margin:6px 0 0"><b>Calentamiento:</b> '+setsText(e.warm)+'</p>':'')+'<p class="small" style="margin:6px 0 0"><b>Trabajo:</b> '+setsText(e.work||[])+' · '+plural((e.work||[]).filter(function(w){return w.done;}).length,'serie marcada','series marcadas')+'</p>'+(e.note?'<p class="small" style="margin:6px 0 0">'+esc(e.note)+'</p>':'')+'</div>';}).join('')+'</div>';
  openSheet({title:'Sesión registrada',body:body});SH.kind='ses';SH.refresh=null;
}
document.addEventListener('keydown',function(e){
  if(e.key!=='Escape')return;
  if($('#dlg').classList.contains('open')){e.preventDefault();closeDlg(false);return;}
  if(SH.open){e.preventDefault();if(SH.back)SH.back();else closeSheet();return;}
  if($('#wo').classList.contains('open')){e.preventDefault();A.woMin();}
});
